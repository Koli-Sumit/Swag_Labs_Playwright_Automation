name: Automation Report

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Playwright Browsers
        run: |
          mvn exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps"

      - name: Run Automation Tests
        run: mvn clean test

      - name: Copy reports to repository root
        run: |
          cp test-output/dashboard-report.html dashboard-report.html
          cp test-output/coverage-report.html coverage-report.html

      - name: Verify generated reports
        run: |
          echo "Repository Root:"
          ls -la
          echo ""
          echo "Test Output:"
          ls -la test-output

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages content
        run: |
          mkdir pages
          cp index.html pages/
          cp dashboard-report.html pages/
          cp coverage-report.html pages/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set timezone to Asia/Kolkata
        run: |
          sudo timedatectl set-timezone Asia/Kolkata || true
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV